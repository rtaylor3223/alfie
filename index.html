function DailyChecklist(){
  const[items,setItems]=useStorage("alfie_checklist",[]);
  const[input,setInput]=useState("");
  const[editId,setEditId]=useState(null);
  const[editText,setEditText]=useState("");
  const today=getTodayKey();
  // Auto-reset completed items at start of new day
  const[lastReset,setLastReset]=useStorage("alfie_checklist_reset","");
  React.useEffect(()=>{if(lastReset!==today){setItems(p=>p.map(i=>Object.assign({},i,{done:false})));setLastReset(today);}},[today]);
  function add(){if(!input.trim())return;setItems(p=>p.concat([{id:Date.now(),text:input.trim(),done:false}]));setInput("");}
  function toggle(id){setItems(p=>p.map(i=>i.id===id?Object.assign({},i,{done:!i.done}):i));}
  function del(id){setItems(p=>p.filter(i=>i.id!==id));}
  function saveEdit(id){if(!editText.trim())return;setItems(p=>p.map(i=>i.id===id?Object.assign({},i,{text:editText.trim()}):i));setEditId(null);}
  function resetAll(){setItems(p=>p.map(i=>Object.assign({},i,{done:false})));}
  const done=items.filter(i=>i.done);
  const pending=items.filter(i=>!i.done);
  const pct=items.length?Math.round(done.length/items.length*100):0;
  return(<div>
    <Card style={{marginBottom:"16px"}}>
      <div style={{padding:"16px 18px",borderBottom:"1px solid "+T.border,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div>
          <div style={{fontSize:"15px",fontWeight:"600",color:T.text}}>Daily Checklist</div>
          <div style={{fontSize:"12px",color:T.mute,marginTop:"2px"}}>{done.length} of {items.length} complete · resets each morning</div>
        </div>
        {done.length>0&&<button onClick={resetAll} style={{background:"transparent",border:"1px solid "+T.border,color:T.mute,fontSize:"11px",padding:"3px 12px",borderRadius:"5px",cursor:"pointer",fontFamily:T.font}}>↺ Reset</button>}
      </div>
      {items.length>0&&<div style={{height:"6px",background:T.muted}}>
        <div style={{height:"100%",width:pct+"%",background:pct===100?T.green:T.blue,borderRadius:"0 4px 4px 0",transition:"width 0.3s ease"}}/>
      </div>}
      <div style={{padding:"16px 18px"}}>
        <div style={{display:"flex",gap:"8px",marginBottom:"20px"}}>
          <Inp value={input} onChange={e=>setInput(e.target.value)} placeholder="Add a daily task…" onKeyDown={e=>e.key==="Enter"&&add()}/>
          <Btn onClick={add} disabled={!input.trim()}>+ Add</Btn>
        </div>
        {items.length===0&&<Empty>No checklist items yet. Add your first daily task above.</Empty>}
        {pending.length>0&&<div style={{marginBottom:"16px"}}>
          {pending.map(item=>(<div key={item.id} style={{display:"flex",alignItems:"center",gap:"12px",padding:"12px 14px",background:T.card,border:"1px solid "+T.border,borderRadius:"8px",marginBottom:"8px"}}>
            <input type="checkbox" checked={false} onChange={()=>toggle(item.id)} style={{width:"18px",height:"18px",accentColor:T.blue,cursor:"pointer",flexShrink:0}}/>
            {editId===item.id?(<div style={{flex:1,display:"flex",gap:"8px"}}>
              <Inp value={editText} onChange={e=>setEditText(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")saveEdit(item.id);if(e.key==="Escape")setEditId(null);}} autoFocus/>
              <Btn onClick={()=>saveEdit(item.id)} style={{fontSize:"12px",padding:"5px 12px"}}>Save</Btn>
              <Btn onClick={()=>setEditId(null)} variant="ghost" style={{fontSize:"12px",padding:"5px 12px"}}>Cancel</Btn>
            </div>):(<>
              <span style={{flex:1,fontSize:"15px",color:T.text}}>{item.text}</span>
              <button onClick={()=>{setEditId(item.id);setEditText(item.text);}} style={{background:"none",border:"1px solid "+T.border,color:T.mute,cursor:"pointer",fontSize:"12px",padding:"2px 10px",borderRadius:"5px",fontFamily:T.font}}>Edit</button>
              <button onClick={()=>del(item.id)} style={{background:"none",border:"none",color:T.mute,cursor:"pointer",fontSize:"18px",padding:"0 2px",lineHeight:1}}>×</button>
            </>)}
          </div>))}
        </div>}
        {done.length>0&&<div>
          <div style={{fontSize:"11px",color:T.mute,fontWeight:"600",letterSpacing:"0.06em",marginBottom:"10px"}}>DONE ({done.length})</div>
          {done.map(item=>(<div key={item.id} style={{display:"flex",alignItems:"center",gap:"12px",padding:"12px 14px",background:T.muted,border:"1px solid "+T.border,borderRadius:"8px",marginBottom:"8px",opacity:0.55}}>
            <input type="checkbox" checked={true} onChange={()=>toggle(item.id)} style={{width:"18px",height:"18px",accentColor:T.green,cursor:"pointer",flexShrink:0}}/>
            <span style={{flex:1,fontSize:"15px",color:T.mute,textDecoration:"line-through"}}>{item.text}</span>
            <button onClick={()=>del(item.id)} style={{background:"none",border:"none",color:T.mute,cursor:"pointer",fontSize:"18px",padding:"0 2px",lineHeight:1}}>×</button>
          </div>))}
        </div>}
      </div>
    </Card>
  </div>);
}

  function confirmClose(t){const realized=closeForm.realizedPnlOverride||calcPnL(t.qty,t.price,closeForm.exitPrice);setTrades(p=>p.map(x=>x.id===t.id?Object.assign({},x,{status:"closed",exitPrice:closeForm.exitPrice,exitDate:closeForm.exitDate,closeNotes:closeForm.notes,realizedPnl:realized}):x));setClosingId(null);}
  async function analyzePosition(t){

    const bestSector=(()=>{const m={};closedTrades.forEach(x=>{const r=getRotationGrade(x.ticker);const s=r?r.sector:"Unknown";if(!m[s])m[s]={w:0,t:0};m[s].t++;if(parseFloat(x.realizedPnl)>0)m[s].w++;});const e=Object.entries(m).sort((a,b)=>(b[1].w/b[1].t)-(a[1].w/a[1].t));return e.length?e[0][0]:null;})();

    const prompt=`You are an options trading analyst. In ONE combined web search, find: latest news, options flow, put/call ratio, dark pool data, AND recent SEC Form 4 insider activity for ${t.ticker}. Then analyze this ${t.contractType} contract.${dnaContext}\n\nContract: ${t.ticker} ${t.contractType} $${t.strike} exp ${t.expiration} (${dte} DTE) | Premium: $${t.price} | Breakeven: $${t.breakeven||"?"} | Delta: ${t.delta||"?"} Theta: ${t.theta||"?"} IV: ${t.iv||"?"}% | Sector: ${sectorName}\n\nWeights: Technical Bias 30%, Options Flow/IV 20%, Sector Rotation 20%, News 15%, Insider Activity 15%.\n\nReturn ONLY JSON, no citation tags, plain text values:\n{"currentPrice":"live stock price as a number string","verdict":"STAY IN","grade":"B","urgency":"no rush","bottomLine":"2-3 sentence recommendation","sectorRotation":{"grade":"B","phase":"Leading","summary":"one sentence"},"newssentiment":{"headline":"","bias":"bullish","summary":"one sentence"},"technicalBias":{"direction":"bullish","summary":"one sentence"},"optionsFlow":{"putCallRatio":"","unusualActivity":"","darkPool":"","socialSentiment":"","summary":"one sentence"},"ivAnalysis":{"environment":"high","decayRisk":"moderate","summary":"one sentence"},"insiderActivity":{"recentBuys":"","recentSells":"","netBias":"neutral","summary":"one sentence"},"weighting":{"sectorRotation":0,"newssentiment":0,"technicalBias":0,"optionsFlow":0,"ivDecay":0},"weightingSummary":"2 sentences on weighting"}`;

      <div style={{display:"flex",gap:"8px",alignItems:"center"}}>{opts.length>0&&<span style={{fontSize:"13px",fontWeight:"700",color:openPnL>=0?T.green:T.red}}>{openPnL>=0?"+":""}${openPnL.toFixed(2)}</span>}{closed.length>0&&<span style={{fontSize:"12px",color:closedPnL>=0?T.green:T.red}}>{closedPnL>=0?"+":""}${closedPnL.toFixed(2)} realized</span>}<Btn onClick={()=>setShowForm(s=>!s)} style={{fontSize:"12px",padding:"5px 12px"}}>{showForm?"Cancel":"+ Add"}</Btn></div>

            {[["DESKTOP","Full Robinhood position page","desktop",screenshotDesktopDone],["MOBILE 1","Position screen — strike, premium","position",screenshot1Done],["MOBILE 2","Greeks screen — delta, IV, OI","greeks",screenshot2Done]].map(([title,desc,type,done])=>(<label key={type} style={{background:T.bluePale,padding:"12px 14px",cursor:"pointer",display:"block"}}><input type="file" accept="image/*" style={{display:"none"}} onChange={e=>handleScreenshot(e.target.files[0],type)}/><div style={{fontSize:"11px",fontWeight:"700",color:T.blue,marginBottom:"4px"}}>{title}</div><div style={{fontSize:"11px",color:T.sub,marginBottom:"8px"}}>{desc}</div><div style={{background:T.blue,color:"#fff",fontSize:"11px",fontWeight:"600",padding:"5px 12px",borderRadius:"5px",textAlign:"center"}}>{imgLoading===type?"Parsing…":done?"✓ Loaded":"Click to Upload"}</div></label>))}

function PortfolioHealth({equities,openOpts,trades}){
  const[health,setHealth]=useStorage("alfie_portfolio_health",null);const[healthDate,setHealthDate]=useStorage("alfie_health_date","");const[loading,setLoading]=useState(false);
  const allTickers=[...new Set([...equities.map(e=>e.ticker),...openOpts.map(t=>t.ticker)])];
  async function runHealthCheck(){
    if(allTickers.length===0)return;setLoading(true);
    const eqByAccount={};equities.forEach(e=>{const acc=e.account||"Individual";if(!eqByAccount[acc])eqByAccount[acc]=[];eqByAccount[acc].push(`${e.ticker}${e.companyName?" ("+e.companyName+")":""} ${e.shares} shares @ $${e.costBasis}`);});
    const eqStr=Object.entries(eqByAccount).map(([acc,tickers])=>`${acc}: ${tickers.join(", ")}`).join(" | ");
    const optStr=openOpts.map(t=>`${t.ticker} ${t.contractType} $${t.strike} exp ${t.expiration}`).join(", ");
    const totalEqValue=equities.reduce((s,e)=>s+(parseFloat(e.currentPrice||e.costBasis||0)*parseFloat(e.shares||0)),0);
    const positions=`EQUITIES ($${totalEqValue.toLocaleString("en-US",{maximumFractionDigits:0})} total): ${eqStr||"None"} | OPTIONS: ${optStr||"None"}`;
    try{
      const sectorExp={};allTickers.forEach(t=>{const r=getRotationGrade(t);if(r){if(!sectorExp[r.sector])sectorExp[r.sector]=0;sectorExp[r.sector]++;}});
      const topSector=Object.entries(sectorExp).sort((a,b)=>b[1]-a[1])[0];
      const concentrationRisk=topSector&&topSector[1]/allTickers.length>0.4?`Overconcentrated in ${topSector[0]} (${Math.round(topSector[1]/allTickers.length*100)}% of positions)`:"Concentration acceptable";
      const sectorAlignments=allTickers.map(t=>{const r=getRotationGrade(t);return r?r.phase:"Unknown";});
      const leadingCount=sectorAlignments.filter(p=>p==="Leading"||p==="Early").length;
      const alignmentScore=Math.round(leadingCount/allTickers.length*100);
      const closedTrades=trades?trades.filter(t=>t.isOption&&t.status==="closed"):[];const tradeCount=closedTrades.length;
      const r=await callAPI([{role:"user",content:`You are a professional portfolio health analyst. Evaluate this portfolio.\n\nPositions: ${positions}\nSector concentration: ${concentrationRisk}\nRotation alignment: ${alignmentScore}% of positions in leading/early sectors\nClosed trades logged: ${tradeCount} (need 20+ for Sharpe/Sortino/Alpha metrics)\n\nGrade these factors (search web for insider activity):\n1. Sector Rotation Alignment (25%)\n2. Insider Activity (25%) - search SEC Form 4 data\n3. Concentration Risk (20%)\n\nNote Sharpe/Sortino/Alpha unlock after 20 closed trades (currently ${tradeCount}).\n\nAlso search web for current expert portfolio recommendations.\n\nReturn ONLY JSON: {"summary":"3-4 sentence CEO-level paragraph","urgentAlert":"one sentence or empty string","overallHealth":"strong|moderate|weak","factors":{"rotationAlignment":"one sentence","insiderActivity":"one sentence from web search","concentrationRisk":"one sentence","sharpeRatio":"Unlocks after 20 closed trades (${tradeCount} logged)","alpha":"Unlocks after 20 closed trades (${tradeCount} logged)"},"recommendations":[{"title":"","rationale":"","action":"","source":""},{"title":"","rationale":"","action":"","source":""},{"title":"","rationale":"","action":"","source":""},{"title":"","rationale":"","action":"","source":""}]}`}],true);
      setHealth(r);setHealthDate(getTodayKey());
    }catch(err){console.error(err);}
    setLoading(false);
  }
  useEffect(()=>{if(allTickers.length===0)return;const today=getTodayKey();if(healthDate!==today||!health)runHealthCheck();},[]);
  if(allTickers.length===0)return null;
  const healthColor=h=>h==="strong"?T.green:h==="weak"?T.red:T.amber;
  return(<Card style={{marginBottom:"16px"}}><div style={{padding:"13px 18px",borderBottom:"1px solid "+T.border,display:"flex",alignItems:"center",justifyContent:"space-between"}}><div style={{display:"flex",alignItems:"center",gap:"8px"}}><span style={{fontSize:"15px",fontWeight:"600",color:T.text}}>Portfolio Health</span>{health&&health.overallHealth&&<span style={{background:healthColor(health.overallHealth)+"22",color:healthColor(health.overallHealth),fontSize:"11px",fontWeight:"700",padding:"2px 10px",borderRadius:"4px",textTransform:"uppercase"}}>{health.overallHealth}</span>}</div><button onClick={runHealthCheck} disabled={loading} style={{background:"transparent",border:"1px solid "+T.border,color:T.mute,fontSize:"11px",padding:"3px 12px",borderRadius:"5px",cursor:"pointer",fontFamily:T.font,opacity:loading?0.5:1}}>{loading?"Analyzing…":"↻ Refresh"}</button></div><div style={{padding:"14px 18px"}}>{loading&&<div style={{display:"flex",alignItems:"center",gap:"8px",fontSize:"13px",color:T.mute}}><div style={{width:"7px",height:"7px",background:T.blue,borderRadius:"50%",animation:"alfpulse 1s infinite"}}/>Scanning all positions for insider flow, risks and opportunities…</div>}{!loading&&health&&<div>{health.urgentAlert&&<div style={{background:T.redPale,border:"1px solid "+T.red,borderRadius:"7px",padding:"10px 14px",marginBottom:"10px",fontSize:"13px",color:T.red,fontWeight:"600"}}>⚡ {health.urgentAlert}</div>}<div style={{fontSize:"13px",color:T.sub,lineHeight:"1.8",marginBottom:"12px"}}>{health.summary}</div>{health.factors&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px",marginBottom:"10px"}}>{[["Rotation Alignment",health.factors.rotationAlignment,false],["Insider Activity",health.factors.insiderActivity,false],["Concentration Risk",health.factors.concentrationRisk,false],["Sharpe / Sortino",health.factors.sharpeRatio,true],["Alpha vs Benchmark",health.factors.alpha,true]].map(([l,v,pending])=>v?<div key={l} style={{background:T.muted,borderRadius:"6px",padding:"8px 10px",opacity:pending?0.6:1,border:pending?"1px dashed "+T.border:"1px solid transparent"}}><div style={{display:"flex",alignItems:"center",gap:"6px",marginBottom:"3px"}}><div style={{fontSize:"10px",color:T.mute,fontWeight:"600"}}>{l.toUpperCase()}</div>{pending&&<span style={{fontSize:"9px",color:T.amber,fontWeight:"600"}}>PENDING</span>}</div><div style={{fontSize:"12px",color:pending?T.mute:T.sub,lineHeight:"1.4"}}>{v}</div></div>:null)}</div>}{health.recommendations&&health.recommendations.length>0&&<div style={{marginTop:"12px"}}><div style={{fontSize:"11px",color:T.mute,fontWeight:"600",letterSpacing:"0.06em",marginBottom:"8px"}}>EXPERT RECOMMENDATIONS</div><div style={{display:"flex",flexDirection:"column",gap:"8px"}}>{health.recommendations.filter(r=>r.title).map((rec,i)=>(<div key={i} style={{background:T.muted,borderRadius:"8px",padding:"12px 14px",borderLeft:"3px solid "+T.blue}}><div style={{fontSize:"13px",fontWeight:"600",color:T.text,marginBottom:"4px"}}>{rec.title}</div><div style={{fontSize:"12px",color:T.sub,lineHeight:"1.5",marginBottom:"6px"}}>{rec.rationale}</div><div style={{fontSize:"12px",color:T.blue,marginBottom:"4px"}}>{"→"} {rec.action}</div>{rec.source&&<div style={{fontSize:"10px",color:T.mute,fontWeight:"600"}}>SOURCE: {rec.source}</div>}</div>))}</div></div>}{healthDate&&<div style={{fontSize:"11px",color:T.mute,marginTop:"10px"}}>Last updated: {healthDate===getTodayKey()?"Today":healthDate}</div>}</div>}{!loading&&!health&&<div style={{fontSize:"13px",color:T.mute,textAlign:"center",padding:"10px 0"}}>Tap Refresh to run your first portfolio health check.</div>}</div></Card>);
}

// Scheduled AM/PM refresh — 6am ET = AM window, 6pm ET = PM window, midnight–6am = null (no refresh)
function getCurrentWindow(){try{const et=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"}));const h=et.getHours();if(h>=6&&h<18)return"am";if(h>=18)return"pm";return null;}catch(e){const h=new Date().getHours();if(h>=6&&h<18)return"am";if(h>=18)return"pm";return null;}}
async function runScheduledRefresh(win,tradesRef,equitiesRef,setTrades,setEquities,setLastRefreshAm,setLastRefreshPm,setRefreshStatus){
  const trades=tradesRef.current||[];const equities=equitiesRef.current||[];
  const openOpts=trades.filter(t=>t.isOption&&t.status==="open");
  const eqTickers=[...new Set(equities.map(e=>(e.ticker||"").toUpperCase()).filter(Boolean))];
  setRefreshStatus({running:true,window:win,step:"Starting "+win.toUpperCase()+" refresh…",lastRun:""});
  try{
    if(eqTickers.length>0){
      setRefreshStatus(s=>Object.assign({},s,{step:"Refreshing "+eqTickers.length+" equities…"}));
      const eqPrompt=`In one combined web search, look up the current stock price, one-sentence latest news, and recent SEC Form 4 insider activity (last 30 days) for each of these tickers: ${eqTickers.join(", ")}. Return ONLY JSON, no citation tags, plain text: {"results":{"TICKER":{"currentPrice":"","news":"one sentence","insider":"one sentence summarizing recent insider buys/sells, or 'none'"}}}`;
      try{const r=await callAPI([{role:"user",content:eqPrompt}],true);if(r&&r.results){const ts=new Date().toLocaleTimeString();setEquities(p=>p.map(e=>{const k=(e.ticker||"").toUpperCase();const u=r.results[k]||r.results[e.ticker];return u?Object.assign({},e,{currentPrice:u.currentPrice||e.currentPrice,lastNews:u.news||e.lastNews,lastInsider:u.insider||e.lastInsider,lastUpdated:ts}):e;}));}}catch(err){console.error("Equity refresh failed:",err);}
    }
    for(let i=0;i<openOpts.length;i++){
      const t=openOpts[i];
      setRefreshStatus(s=>Object.assign({},s,{step:"Analyzing "+(i+1)+"/"+openOpts.length+": "+t.ticker+"…"}));
      const sector=getRotationGrade(t.ticker);const sectorName=sector?sector.sector:"Unknown";
      const dte=t.expiration?Math.ceil((new Date(t.expiration)-new Date())/86400000):"Unknown";
      const optPrompt=`You are an options trading analyst. In ONE combined web search, find: latest news, options flow, put/call ratio, dark pool data, AND recent SEC Form 4 insider activity for ${t.ticker}. Then analyze this ${t.contractType} contract.\n\nContract: ${t.ticker} ${t.contractType} $${t.strike} exp ${t.expiration} (${dte} DTE) | Premium: $${t.price} | Breakeven: $${t.breakeven||"?"} | Delta: ${t.delta||"?"} Theta: ${t.theta||"?"} IV: ${t.iv||"?"}% | Sector: ${sectorName}\n\nWeights: Technical Bias 30%, Options Flow/IV 20%, Sector Rotation 20%, News 15%, Insider Activity 15%.\n\nReturn ONLY JSON, no citation tags, plain text values:\n{"currentPrice":"","verdict":"STAY IN","grade":"B","urgency":"no rush","bottomLine":"2-3 sentence recommendation","sectorRotation":{"grade":"B","phase":"Leading","summary":"one sentence"},"newssentiment":{"headline":"","bias":"bullish","summary":"one sentence"},"technicalBias":{"direction":"bullish","summary":"one sentence"},"optionsFlow":{"putCallRatio":"","unusualActivity":"","darkPool":"","socialSentiment":"","summary":"one sentence"},"ivAnalysis":{"environment":"high","decayRisk":"moderate","summary":"one sentence"},"insiderActivity":{"recentBuys":"","recentSells":"","netBias":"neutral","summary":"one sentence"},"weighting":{"sectorRotation":0,"newssentiment":0,"technicalBias":0,"optionsFlow":0,"ivDecay":0},"weightingSummary":"2 sentences on weighting"}`;
      try{const r=await callAPI([{role:"user",content:optPrompt}],true);const ts=new Date().toLocaleTimeString();const iso=new Date().toISOString();setTrades(p=>p.map(x=>x.id===t.id?Object.assign({},x,{currentPrice:r.currentPrice||x.currentPrice,lastAnalysis:r,lastAnalysisAt:iso,lastUpdated:ts}):x));}catch(err){console.error("Option refresh failed for "+t.ticker+":",err);}
    }
    const today=getTodayKey();
    if(win==="am")setLastRefreshAm(today);else setLastRefreshPm(today);
    setRefreshStatus({running:false,window:win,step:"",lastRun:new Date().toLocaleTimeString(),lastWindow:win,positionsRefreshed:openOpts.length,equitiesRefreshed:eqTickers.length});
  }catch(err){setRefreshStatus({running:false,window:win,step:"",error:err.message});}
}

function App(){
  const[tab,setTab]=useState("brief");
  const[equities,setEquities]=useStorage("alfie_equities",[]);
  const[sectorUpdates,setSectorUpdates]=useStorage("alfie_sector_updates",{});
  const[convList,setConvList]=useStorage("alfie_conv",TOP_CONVICTION);
  const[trades,setTrades]=useStorage("alfie_trades",[]);
  const[lastRefreshAm,setLastRefreshAm]=useStorage("alfie_last_refresh_am","");
  const[lastRefreshPm,setLastRefreshPm]=useStorage("alfie_last_refresh_pm","");
  const[refreshStatus,setRefreshStatus]=useState({running:false,window:null,step:"",lastRun:""});
  const tradesRef=useRef(trades);const equitiesRef=useRef(equities);const refreshRunningRef=useRef(false);
  useEffect(()=>{tradesRef.current=trades;},[trades]);
  useEffect(()=>{equitiesRef.current=equities;},[equities]);
  useEffect(()=>{refreshRunningRef.current=refreshStatus.running;},[refreshStatus.running]);
  useEffect(()=>{
    let tid,iid;
    function check(){
      if(refreshRunningRef.current)return;
      const win=getCurrentWindow();if(!win)return;
      const today=getTodayKey();
      if(win==="am"&&lastRefreshAm===today)return;
      if(win==="pm"&&lastRefreshPm===today)return;
      runScheduledRefresh(win,tradesRef,equitiesRef,setTrades,setEquities,setLastRefreshAm,setLastRefreshPm,setRefreshStatus);
    }
    tid=setTimeout(check,4000);
    iid=setInterval(check,600000);
    return()=>{clearTimeout(tid);clearInterval(iid);};
  },[lastRefreshAm,lastRefreshPm]);
  const[journal,setJournal]=useStorage("alfie_journal",{});
  const[rTicker,setRTicker]=useState("");const[rNotes,setRNotes]=useState("");const[rSentiment,setRSentiment]=useState("");const[rData,setRData]=useState(null);const[rLoading,setRLoading]=useState(false);const[rError,setRError]=useState(null);
  const[time,setTime]=useState(new Date());
  useEffect(()=>{dailyBackup();},[]);
  useEffect(()=>{const id=setInterval(()=>setTime(new Date()),1000);return()=>clearInterval(id);},[]);
  const dateStr=new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
  return(<div style={{minHeight:"100vh",background:T.bg,color:T.text,fontFamily:T.font}}>
    <div style={{background:"#010409",borderBottom:"1px solid "+T.border,padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <SyncBadge/>
      <div style={{textAlign:"center"}}><div style={{fontSize:"22px",fontWeight:"700",color:"#fff"}}>Alfie</div><div style={{fontSize:"11px",color:T.navyLight,marginTop:"2px",letterSpacing:"0.04em"}}>Personal command center</div></div>
      <div style={{textAlign:"right"}}><div style={{fontSize:"10px",color:T.navyLight}}>{dateStr}</div><div style={{fontSize:"16px",fontWeight:"300",color:"#fff",marginTop:"2px"}}>{time.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}</div></div>
    </div>
    {rLoading&&<div style={{background:T.bluePale,borderBottom:"1px solid "+T.border,padding:"8px 16px",display:"flex",alignItems:"center",gap:"10px"}}><div style={{width:"8px",height:"8px",background:T.blue,borderRadius:"50%",animation:"alfpulse 1s infinite",flexShrink:0}}/><span style={{fontSize:"13px",color:T.blue,fontWeight:"500"}}>Researching {rTicker}…</span><span style={{marginLeft:"auto",fontSize:"12px",color:T.blue,cursor:"pointer",textDecoration:"underline"}} onClick={()=>setTab("research")}>View →</span></div>}
    <Nav active={tab} setActive={setTab}/>
    <div style={{maxWidth:"1400px",margin:"0 auto",padding:"16px"}}>
      {tab==="brief"&&<MorningBrief trades={trades} equities={equities} setSectorUpdates={setSectorUpdates} setConvList={setConvList} lastRefreshAm={lastRefreshAm} lastRefreshPm={lastRefreshPm} refreshStatus={refreshStatus}/>}
      {tab==="portfolio"&&<PortfolioOverview trades={trades} equities={equities} setEquities={setEquities}/>}
      {tab==="checklist"&&<DailyChecklist/>}
      {tab==="trades"&&<TradeJournal trades={trades} setTrades={setTrades}/>}
      {tab==="research"&&<TradeResearch sectorUpdates={sectorUpdates} convList={convList} ticker={rTicker} setTicker={setRTicker} notes={rNotes} setNotes={setRNotes} sentiment={rSentiment} setSentiment={setRSentiment} research={rData} setResearch={setRData} loading={rLoading} setLoading={setRLoading} error={rError} setError={setRError}/>}
      {tab==="social"&&<SocialFeed/>}
      {tab==="journal"&&<DailyJournal entries={journal} setEntries={setJournal}/>}
    </div>
  </div>);
}
const ALFIE_PASSWORD="champ2025";
function Login({onAuth}){
  const[pw,setPw]=useState("");const[err,setErr]=useState(false);const[shake,setShake]=useState(false);
  function attempt(){
    if(pw===ALFIE_PASSWORD){localStorage.setItem("alfie_auth","1");onAuth();}
    else{setErr(true);setShake(true);setPw("");setTimeout(()=>setShake(false),500);}
  }
  return(<div style={{minHeight:"100vh",background:"#0d1117",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:T.font}}>
    <div style={{background:T.card,border:"1px solid "+T.border,borderRadius:"16px",padding:"40px 36px",width:"100%",maxWidth:"360px",textAlign:"center",animation:shake?"shake 0.4s ease":"none"}}>
      <style>{`@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}`}</style>
      <div style={{fontSize:"32px",marginBottom:"8px"}}>🤖</div>
      <div style={{fontSize:"22px",fontWeight:"700",color:"#fff",marginBottom:"4px"}}>Alfie</div>
      <div style={{fontSize:"12px",color:T.mute,marginBottom:"28px",letterSpacing:"0.04em"}}>PERSONAL COMMAND CENTER</div>
      <input
        type="password"
        value={pw}
        onChange={e=>{setPw(e.target.value);setErr(false);}}
        onKeyDown={e=>e.key==="Enter"&&attempt()}
        placeholder="Password"
        autoFocus
        style={{background:T.muted,border:"1px solid "+(err?T.red:T.border),color:T.text,padding:"10px 14px",fontSize:"15px",fontFamily:T.font,outline:"none",width:"100%",boxSizing:"border-box",borderRadius:"8px",marginBottom:"10px",textAlign:"center",letterSpacing:"0.15em"}}
      />
      {err&&<div style={{fontSize:"12px",color:T.red,marginBottom:"10px"}}>Incorrect password</div>}
      <button onClick={attempt} style={{background:T.blue,color:"#fff",border:"none",padding:"10px",fontSize:"14px",fontWeight:"600",cursor:"pointer",fontFamily:T.font,borderRadius:"8px",width:"100%"}}>Enter</button>
    </div>
  </div>);
}
function Root(){
  const[authed,setAuthed]=useState(()=>localStorage.getItem("alfie_auth")==="1");
  if(!authed)return <Login onAuth={()=>setAuthed(true)}/>;
  return <App/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
