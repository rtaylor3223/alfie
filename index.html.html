async function saveBackup(key, value) {
  if (!supabase) return;

    await supabase.from("alfie_data").upsert({key:backupKey, value:JSON.stringify(value)}, {onConflict:"key"});

async function getBackups(key) {
  if (!supabase) return [];

function DailyChecklist(){
  const[items,setItems]=useStorage("alfie_checklist",[]);
  const[input,setInput]=useState("");
  const[editId,setEditId]=useState(null);
  const[editText,setEditText]=useState("");
  const today=getTodayKey();
  // Auto-reset completed items at start of new day
  const[lastReset,setLastReset]=useStorage("alfie_checklist_reset","");
  React.useEffect(()=>{if(lastReset!==today){setItems(p=>p.map(i=>Object.assign({},i,{done:false})));setLastReset(today);}},[today]);
  function add(){if(!input.trim())return;setItems(p=>p.concat([{id:Date.now(),text:input.trim(),done:false}]));setInput("");}
  function toggle(id){setItems(p=>p.map(i=>i.id===id?Object.assign({},i,{done:!i.done}):i));}
  function del(id){setItems(p=>p.filter(i=>i.id!==id));}
  function saveEdit(id){if(!editText.trim())return;setItems(p=>p.map(i=>i.id===id?Object.assign({},i,{text:editText.trim()}):i));setEditId(null);}
  function resetAll(){setItems(p=>p.map(i=>Object.assign({},i,{done:false})));}
  const done=items.filter(i=>i.done);
  const pending=items.filter(i=>!i.done);
  const pct=items.length?Math.round(done.length/items.length*100):0;
  return(<div>
    <Card style={{marginBottom:"16px"}}>
      <div style={{padding:"16px 18px",borderBottom:"1px solid "+T.border,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div>
          <div style={{fontSize:"15px",fontWeight:"600",color:T.text}}>Daily Checklist</div>
          <div style={{fontSize:"12px",color:T.mute,marginTop:"2px"}}>{done.length} of {items.length} complete · resets each morning</div>
        </div>
        {done.length>0&&<button onClick={resetAll} style={{background:"transparent",border:"1px solid "+T.border,color:T.mute,fontSize:"11px",padding:"3px 12px",borderRadius:"5px",cursor:"pointer",fontFamily:T.font}}>↺ Reset</button>}
      </div>
      {items.length>0&&<div style={{height:"6px",background:T.muted}}>
        <div style={{height:"100%",width:pct+"%",background:pct===100?T.green:T.blue,borderRadius:"0 4px 4px 0",transition:"width 0.3s ease"}}/>
      </div>}
      <div style={{padding:"16px 18px"}}>
        <div style={{display:"flex",gap:"8px",marginBottom:"20px"}}>
          <Inp value={input} onChange={e=>setInput(e.target.value)} placeholder="Add a daily task…" onKeyDown={e=>e.key==="Enter"&&add()}/>
          <Btn onClick={add} disabled={!input.trim()}>+ Add</Btn>
        </div>
        {items.length===0&&<Empty>No checklist items yet. Add your first daily task above.</Empty>}
        {pending.length>0&&<div style={{marginBottom:"16px"}}>
          {pending.map(item=>(<div key={item.id} style={{display:"flex",alignItems:"center",gap:"12px",padding:"12px 14px",background:T.card,border:"1px solid "+T.border,borderRadius:"8px",marginBottom:"8px"}}>
            <input type="checkbox" checked={false} onChange={()=>toggle(item.id)} style={{width:"18px",height:"18px",accentColor:T.blue,cursor:"pointer",flexShrink:0}}/>
            {editId===item.id?(<div style={{flex:1,display:"flex",gap:"8px"}}>
              <Inp value={editText} onChange={e=>setEditText(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")saveEdit(item.id);if(e.key==="Escape")setEditId(null);}} autoFocus/>
              <Btn onClick={()=>saveEdit(item.id)} style={{fontSize:"12px",padding:"5px 12px"}}>Save</Btn>
              <Btn onClick={()=>setEditId(null)} variant="ghost" style={{fontSize:"12px",padding:"5px 12px"}}>Cancel</Btn>
            </div>):(<>
              <span style={{flex:1,fontSize:"15px",color:T.text}}>{item.text}</span>
              <button onClick={()=>{setEditId(item.id);setEditText(item.text);}} style={{background:"none",border:"1px solid "+T.border,color:T.mute,cursor:"pointer",fontSize:"12px",padding:"2px 10px",borderRadius:"5px",fontFamily:T.font}}>Edit</button>
              <button onClick={()=>del(item.id)} style={{background:"none",border:"none",color:T.mute,cursor:"pointer",fontSize:"18px",padding:"0 2px",lineHeight:1}}>×</button>
            </>)}
          </div>))}
        </div>}
        {done.length>0&&<div>
          <div style={{fontSize:"11px",color:T.mute,fontWeight:"600",letterSpacing:"0.06em",marginBottom:"10px"}}>DONE ({done.length})</div>
          {done.map(item=>(<div key={item.id} style={{display:"flex",alignItems:"center",gap:"12px",padding:"12px 14px",background:T.muted,border:"1px solid "+T.border,borderRadius:"8px",marginBottom:"8px",opacity:0.55}}>
            <input type="checkbox" checked={true} onChange={()=>toggle(item.id)} style={{width:"18px",height:"18px",accentColor:T.green,cursor:"pointer",flexShrink:0}}/>
            <span style={{flex:1,fontSize:"15px",color:T.mute,textDecoration:"line-through"}}>{item.text}</span>
            <button onClick={()=>del(item.id)} style={{background:"none",border:"none",color:T.mute,cursor:"pointer",fontSize:"18px",padding:"0 2px",lineHeight:1}}>×</button>
          </div>))}
        </div>}
      </div>
    </Card>
  </div>);

function calcBreakeven(type,strike,premium){const s=parseFloat(strike),p=parseFloat(premium);if(!s||!p)return null;return type==="CALL"?(s+p).toFixed(2):(s-p).toFixed(2);}
function calcPnL(qty,premium,exitPrice){const q=parseFloat(qty)||1,p=parseFloat(premium)||0,e=parseFloat(exitPrice)||0;return((e-p)*q*100).toFixed(2);}

function CurrentOptions({trades,setTrades}){

    const totalQty=parseFloat(t.qty)||1;

    const isPartial=qtyClosing<totalQty;
    setTrades(p=>{
      const updated=p.map(x=>{
        if(x.id!==t.id)return x;

          // Reduce open position qty
          return Object.assign({},x,{qty:String(totalQty-qtyClosing)});

Url} style={{maxHeight:"200px",maxWidth:"100%",borderRadius:"8px",border:"1px solid "+T.border,objectFit:"contain"}} alt="post"/></div>}{post.summary&&<div style={{background:T.muted,borderRadius:"8px",padding:"12px",marginTop:"14px",marginBottom:"12px",fontSize:"13px",color:T.text,lineHeight:"1.7"}}>{post.summary}</div>}{post.keyPoints&&post.keyPoints.filter(k=>k).length>0&&<div style={{marginBottom:"12px"}}><Lbl style={{marginBottom:"6px"}}>Key Points</Lbl>{post.keyPoints.filter(k=>k).map((pt,i)=><div key={i} style={{fontSize:"13px",color:T.sub,marginBottom:"4px",paddingLeft:"12px",borderLeft:"2px solid "+T.border}}>• {pt}</div>)}</div>}{post.actionItems&&post.actionItems.length>0&&<div><Lbl style={{marginBottom:"8px"}}>Action Items</Lbl>{post.actionItems.map((action,idx)=>{const icon=ACTION_ICONS[action.type]||"📌";const color=ACTION_COLORS[action.type]||T.mute;return(<div key={idx} style={{display:"flex",alignItems:"flex-start",gap:"10px",padding:"10px 12px",background:action.done?T.muted:T.card,border:"1px solid "+T.border,borderRadius:"8px",marginBottom:"6px",opacity:action.done?0.6:1}}><input type="checkbox" checked={action.done} onChange={()=>toggleAction(post.id,idx)} style={{width:"16px",height:"16px",accentColor:T.blue,cursor:"pointer",flexShrink:0,marginTop:"1px"}}/><div style={{flex:1}}><div style={{display:"flex",alignItems:"center",gap:"6px",marginBottom:"2px",flexWrap:"wrap"}}><span style={{fontSize:"13px"}}>{icon}</span><span style={{fontSize:"11px",fontWeight:"700",color,textTransform:"uppercase",letterSpacing:"0.05em"}}>{action.type}</span>{action.ticker&&<span style={{background:T.bluePale,color:T.blue,fontSize:"11px",fontWeight:"700",padding:"1px 6px",borderRadius:"4px"}}>${action.ticker}</span>}</div><div style={{fontSize:"13px",color:action.done?T.mute:T.text,textDecoration:action.done?"line-through":"none",lineHeight:"1.4"}}>{action.text}</div></div></div>);})}</div>}</div>}</Card>);})}</div>);
}

const MOODS=[{e:"🌟",l:"Great"},{e:"😊",l:"Good"},{e:"😐",l:"Neutral"},{e:"😔",l:"Low"},{e:"😤",l:"Rough"}];
function DailyJournal({entries,setEntries}){
  const[date,setDate]=useState(getTodayKey());const[view,setView]=useState("write");
  const entry=entries[date]||{mood:"",morningNote:"",eveningNote:"",gratitude:"",goals:"",reflection:""};
  function sf(k,v){setEntries(p=>{const d=Object.assign({},p[date]||{});d[k]=v;return Object.assign({},p,{[date]:d});});}
  const sorted=Object.keys(entries).sort((a,b)=>b.localeCompare(a));
  function Field({label,field,placeholder,rows}){return(<div style={{marginBottom:"14px"}}><Lbl>{label}</Lbl><textarea value={entry[field]||""} onChange={e=>sf(field,e.target.value)} placeholder={placeholder} rows={rows||4} style={Object.assign({},IS,{resize:"vertical",lineHeight:"1.7",padding:"9px 12px",fontSize:"13px"})}/></div>);}
  return(<div><div style={{display:"flex",gap:"10px",alignItems:"center",marginBottom:"16px",flexWrap:"wrap"}}><input type="date" value={date} onChange={e=>setDate(e.target.value)} style={Object.assign({},IS,{width:"155px"})}/><span style={{fontSize:"13px",color:T.sub,fontWeight:"500"}}>{date===getTodayKey()?"Today":fmtDate(date)}</span><div style={{marginLeft:"auto",display:"flex",gap:"6px"}}>{["write","history"].map(v=><button key={v} onClick={()=>setView(v)} style={{background:view===v?T.blue:"transparent",color:view===v?"#fff":T.sub,border:"1px solid "+(view===v?T.blue:T.border),padding:"5px 16px",fontSize:"12px",cursor:"pointer",fontFamily:T.font,borderRadius:"7px",fontWeight:"500"}}>{v==="write"?"Write":"History"}</button>)}</div></div>{view==="write"&&<div><Card style={{padding:"16px 18px",marginBottom:"14px"}}><Lbl>How are you feeling?</Lbl><div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>{MOODS.map(m=><button key={m.l} onClick={()=>sf("mood",m.l)} style={{background:entry.mood===m.l?T.bluePale:"transparent",border:"1px solid "+(entry.mood===m.l?T.blue:T.border),color:entry.mood===m.l?T.blue:T.sub,padding:"7px 16px",fontSize:"13px",cursor:"pointer",fontFamily:T.font,borderRadius:"8px",display:"flex",alignItems:"center",gap:"6px",fontWeight:"500"}}><span style={{fontSize:"16px"}}>{m.e}</span>{m.l}</button>)}</div></Card><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px"}}><Card style={{padding:"18px"}}><div style={{fontSize:"14px",fontWeight:"600",color:T.text,marginBottom:"14px",paddingBottom:"10px",borderBottom:"1px solid "+T.border}}>🌅 Morning</div><Field label="Intentions" field="morningNote" placeholder="What do I want to accomplish today?" rows={4}/><Field label="Goals" field="goals" placeholder="1." rows={4}/></Card><Card style={{padding:"18px"}}><div style={{fontSize:"14px",fontWeight:"600",color:T.text,marginBottom:"14px",paddingBottom:"10px",borderBottom:"1px solid "+T.border}}>🌊 Evening</div><Field label="Reflection" field="reflection" placeholder="How did the day go?" rows={4}/><Field label="Gratitude" field="gratitude" placeholder="Three things I am grateful for..." rows={3}/><Field label="Notes" field="eveningNote" placeholder="Final thoughts..." rows={2}/></Card></div></div>}{view==="history"&&<div>{sorted.length===0&&<Empty>No journal entries yet.</Empty>}{sorted.map(d=>{const e=entries[d];if(!e||(!e.morningNote&&!e.eveningNote&&!e.reflection&&!e.gratitude&&!e.goals))return null;return(<Card key={d} style={{marginBottom:"6px",cursor:"pointer"}} onClick={()=>{setDate(d);setView("write");}}><div style={{padding:"13px 18px"}}><div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:e.reflection?"6px":"0"}}><span style={{fontSize:"13px",fontWeight:"600",color:T.text}}>{fmtDate(d)}</span>{d===getTodayKey()&&<Pill bg={T.bluePale} color={T.blue}>Today</Pill>}{e.mood&&<span style={{fontSize:"15px"}}>{(MOODS.find(m=>m.l===e.mood)||{e:""}).e}</span>}<span style={{marginLeft:"auto",fontSize:"12px",color:T.mute}}>Open</span></div>{e.reflection&&<div style={{fontSize:"12px",color:T.sub,lineHeight:"1.6",overflow:"hidden",display:"-webkit-box",WebkitLineClamp:"2",WebkitBoxOrient:"vertical"}}>{e.reflection}</div>}</div></Card>);})}</div>}</div>);
}


// ── AGENT REPORT ─────────────────────────────────────────────────────────────
const AGENT_KEYS = {
  strategist: "agent_strategist",
  quant: "agent_quant",
  risk: "agent_risk",
  execution: "agent_execution",
  meta: "agent_meta"
};

function AgentReport(){
  const[reports,setReports]=useState({});
  const[loading,setLoading]=useState(true);
  const[running,setRunning]=useState(false);
  const[view,setView]=useState("today");
  const[history,setHistory]=useState([]);
  const[selectedDay,setSelectedDay]=useState(getTodayKey());

  // Load today's reports from Supabase on mount
  useEffect(()=>{loadReports(getTodayKey());},[]);

  async function loadReports(dateKey){
    setLoading(true);
    try{
      const results={};
      for(const[name,baseKey] of Object.entries(AGENT_KEYS)){
        const key=baseKey+"_"+dateKey;
        const data=await dbGet(key);
        if(data)results[name]=data;
      }
      setReports(results);
      // Load history keys
      if(supabase){
        const{data}=await supabase.from("alfie_data").select("key").like("key","agent_meta_%").order("key",{ascending:false}).limit(7);
        if(data){
          const days=data.map(d=>d.key.replace("agent_meta_","")).filter(d=>d.match(/^\d{4}-\d{2}-\d{2}$/));
          setHistory(days);
        }
      }
    }catch(e){console.error(e);}
    setLoading(false);
  }

  async function runNow(){
    if(!supabase){alert("Supabase required to run agents.");return;}
    setRunning(true);
    try{
      // ── Build trading history context from notes ──────────────────────
      const allTrades=await dbGet("alfie_trades")||[];
      const closedTrades=allTrades.filter(t=>t.status==="closed"&&t.isOption);
      const openTrades=allTrades.filter(t=>t.status==="open"&&t.isOption);
      const wins=closedTrades.filter(t=>parseFloat(t.realizedPnl||0)>0).length;
      const losses=closedTrades.filter(t=>parseFloat(t.realizedPnl||0)<0).length;
      const winRate=closedTrades.length>0?Math.round((wins/closedTrades.length)*100):0;
      const totalPnl=closedTrades.reduce((sum,t)=>sum+parseFloat(t.realizedPnl||0),0);
      const closedSummary=closedTrades.slice(-20).map(t=>"("+(parseFloat(t.realizedPnl||0)>0?"WIN":"LOSS")+") "+t.ticker+" "+t.contractType+" $"+t.strike+" P&L:$"+parseFloat(t.realizedPnl||0).toFixed(0)+" Entry:"+(t.notes||"none")+" Exit:"+(t.closeNotes||"none")).join("; ")||"No closed trades yet";
      const openSummary=openTrades.map(t=>t.ticker+" "+t.contractType+" $"+t.strike+" exp "+t.expiration+" Thesis:"+(t.notes||"none")).join("; ")||"No open positions";
      const tradingContext="TRADER PROFILE — Win Rate: "+winRate+"% ("+wins+"W/"+losses+"L) Total P&L: $"+totalPnl.toFixed(0)+" | Recent trades: "+closedSummary+" | Open positions: "+openSummary;
            // Strategist Agent
      const strategistRes=await callAPI([{role:"user",content:`You are the Strategist Agent for Alfie, a personal trading system. Search the web for: current macro conditions, FRED economic data, overseas market activity (European and Asian markets), and any major earnings or geopolitical developments. Here is the trader profile to personalize your thesis:\n${tradingContext}\n\nBuild a structured macro thesis that accounts for this traders open positions and patterns. Return ONLY JSON: {"summary":"2-3 sentence macro thesis","regime":"risk-on|risk-off|neutral","keyThemes":[{"theme":"","implication":"","probability":0}],"sectorBias":{"favor":[""],"avoid":[""]},"riskTriggers":[""],"confidence":0}`}],true);
      await dbSet(AGENT_KEYS.strategist+"_"+getTodayKey(), Object.assign({},strategistRes,{runAt:new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",timeZone:"America/New_York"}),date:getTodayKey()}));

      // Quant Scanner Agent
      const quantRes=await callAPI([{role:"user",content:`You are the Quant Scanner Agent. Search for top momentum stocks in leading sectors right now. For each, identify the best options contract with 60-90 day expiration that achieves a 3:1 risk/reward. Trader profile for personalization:\n${tradingContext}\n\nAvoid tickers already in open positions. Focus on: Semiconductors, Energy & Utilities, Industrials, Materials, Nuclear. Return ONLY JSON: {"scanTime":"","topPicks":[{"ticker":"","sector":"","contractType":"CALL","strike":"","expiration":"YYYY-MM-DD","premium":"","entry":"","target":"","stop":"","rr":"","grade":"A","ivPct":"","dte":0,"thesis":"one sentence"}],"marketBreadth":"","sectorLeader":""}`}],true);
      await dbSet(AGENT_KEYS.quant+"_"+getTodayKey(), Object.assign({},quantRes,{runAt:new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",timeZone:"America/New_York"}),date:getTodayKey()}));

      // Risk & Portfolio Agent - reads from Supabase trades/equities
      const tradesData=await dbGet("alfie_trades")||[];
      const equitiesData=await dbGet("alfie_equities")||[];
      const openOpts=tradesData.filter(t=>t.isOption&&t.status==="open");
      const positionSummary=`Open options: ${openOpts.map(t=>`${t.ticker} ${t.contractType} $${t.strike} exp ${t.expiration}`).join(", ")||"None"} | Equities: ${equitiesData.map(e=>`${e.ticker} ${e.shares}sh @ $${e.costBasis}`).join(", ")||"None"}`;
      const riskRes=await callAPI([{role:"user",content:`You are the Risk & Portfolio Agent. Analyze these positions for overnight risk: ${positionSummary}. Trader notes for open positions:\n${tradingContext}\n\nIf the original entry thesis no longer holds based on notes, flag it as an alert. Search for any after-hours news, earnings, or macro events that could affect these positions by market open. Return ONLY JSON: {"overallRisk":"low|moderate|high","alerts":[{"ticker":"","alert":"","urgency":"high|medium|low"}],"concentrationRisk":"one sentence","correlationNote":"one sentence","recommendation":"one sentence action for tomorrow","vixEnvironment":""}`}],true);
      await dbSet(AGENT_KEYS.risk+"_"+getTodayKey(), Object.assign({},riskRes,{runAt:new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",timeZone:"America/New_York"}),date:getTodayKey()}));

      // Execution Agent
      const execRes=await callAPI([{role:"user",content:`You are the Execution Agent. Trader has a ${winRate}% win rate over ${closedTrades.length} trades with $${totalPnl.toFixed(0)} total P&L. Adjust position sizing based on current streak — if losing streak, recommend smaller sizes. Based on current pre-market volatility and liquidity conditions, provide position sizing guidance for today. Return ONLY JSON: {"marketCondition":"normal|volatile|illiquid","suggestedPositionSize":"% of portfolio per trade as a number","maxContracts":0,"entryStrategy":"limit|market|scaled","notes":"one sentence on today's execution environment","vixAdjustment":"one sentence"}`}],true);
      await dbSet(AGENT_KEYS.execution+"_"+getTodayKey(), Object.assign({},execRes,{runAt:new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",timeZone:"America/New_York"}),date:getTodayKey()}));

      // Write meta record
      await dbSet(AGENT_KEYS.meta+"_"+getTodayKey(),{date:getTodayKey(),completedAt:new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",timeZone:"America/New_York"}),status:"complete"});

      // Purge records older than 7 days
      if(supabase){
        const cutoff=new Date();cutoff.setDate(cutoff.getDate()-7);
        const cutoffStr=cutoff.toISOString().slice(0,10);
        for(const baseKey of Object.values(AGENT_KEYS)){
          const{data}=await supabase.from("alfie_data").select("key").like("key",baseKey+"_%");
          if(data){
            const oldKeys=data.filter(d=>{const dateStr=d.key.replace(baseKey+"_","");return dateStr<cutoffStr;}).map(d=>d.key);
            for(const k of oldKeys){await supabase.from("alfie_data").delete().eq("key",k);}
          }
        }
      }
      await loadReports(getTodayKey());
    }catch(err){console.error("Agent run error:",err);}
    setRunning(false);
  }

  const gradeColor=g=>g==="A"||g==="A+"?T.green:g==="B"||g==="B+"?"#5a9a5a":g==="C"?T.amber:T.red;
  const riskColor=r=>r==="high"?T.red:r==="moderate"?T.amber:T.green;
  const s=reports.strategist;const q=reports.quant;const r=reports.risk;const e=reports.execution;
  const meta=reports.meta;
  const hasData=s||q||r||e;

  return(<div>
    {/* Header */}
    <div style={{background:T.navy,borderRadius:"12px",padding:"20px",marginBottom:"16px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:"10px"}}>
        <div>
          <div style={{fontSize:"22px",fontWeight:"700",color:"#fff",marginBottom:"4px"}}>🤖 Agent Report</div>
          <div style={{fontSize:"13px",color:T.navyLight}}>{meta?`Last run: ${meta.completedAt} ET`:"Runs daily at 5:15am ET"}</div>
          {!hasData&&!loading&&<div style={{fontSize:"12px",color:T.amber,marginTop:"4px"}}>⏳ Waiting for Mac Mini — agents run at 5:15am ET</div>}
        </div>
        <div style={{display:"flex",gap:"8px",alignItems:"center"}}>
          {/* History selector */}
          {history.length>1&&<select value={selectedDay} onChange={e=>{setSelectedDay(e.target.value);loadReports(e.target.value);}} style={{background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",color:"#fff",fontSize:"12px",padding:"5px 10px",borderRadius:"6px",fontFamily:T.font,outline:"none"}}>
            {history.map(d=><option key={d} value={d} style={{background:T.navy}}>{d===getTodayKey()?"Today":d}</option>)}
          </select>}
          <button onClick={runNow} disabled={running||loading} style={{background:"rgba(37,99,235,0.3)",border:"1px solid rgba(37,99,235,0.5)",color:"#93c5fd",fontSize:"12px",fontWeight:"700",padding:"6px 16px",borderRadius:"6px",cursor:running?"not-allowed":"pointer",fontFamily:T.font,opacity:running?0.6:1}}>
            {running?"Running...":"▶ Run Now"}
          </button>
        </div>
      </div>
      {running&&<div style={{marginTop:"12px",display:"flex",alignItems:"center",gap:"8px",fontSize:"12px",color:T.navyLight}}><div style={{width:"8px",height:"8px",background:T.navyLight,borderRadius:"50%",animation:"alfpulse 1s infinite"}}/>Agents running — this takes 3-5 minutes…</div>}
    </div>

    {loading&&<div style={{textAlign:"center",padding:"40px",color:T.mute,fontSize:"14px"}}>Loading agent reports…</div>}

    {!loading&&!hasData&&<div>
      <Card style={{padding:"24px",textAlign:"center",marginBottom:"12px"}}>
        <div style={{fontSize:"40px",marginBottom:"12px"}}>🤖</div>
        <div style={{fontSize:"16px",fontWeight:"600",color:T.text,marginBottom:"8px"}}>Agents Not Yet Running</div>
        <div style={{fontSize:"13px",color:T.mute,marginBottom:"16px",lineHeight:"1.6"}}>Your Mac Mini arrives tomorrow. Once set up, agents will run automatically at 5:15am ET and report here every morning. Use Run Now to test manually.</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",textAlign:"left"}}>
          {[["🧠 Strategist","Macro thesis, regime, sector bias"],["📊 Quant Scanner","Top option contract picks for today"],["🛡 Risk & Portfolio","Overnight position monitoring"],["⚙️ Execution","Position sizing & entry strategy"]].map(([name,desc])=>(<div key={name} style={{background:T.muted,borderRadius:"8px",padding:"12px"}}><div style={{fontSize:"13px",fontWeight:"600",color:T.text,marginBottom:"4px"}}>{name}</div><div style={{fontSize:"12px",color:T.mute}}>{desc}</div></div>))}
        </div>
      </Card>
    </div>}

    {!loading&&hasData&&<div style={{display:"grid",gap:"12px"}}>
      {/* Strategist */}
      {s&&<Card style={{padding:"16px"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"12px",flexWrap:"wrap",gap:"8px"}}>
          <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
            <span style={{fontSize:"18px"}}>🧠</span>
            <span style={{fontSize:"15px",fontWeight:"600",color:T.text}}>Strategist</span>
            <span style={{background:s.regime==="risk-on"?T.greenPale:s.regime==="risk-off"?T.redPale:T.amberPale,color:s.regime==="risk-on"?T.green:s.regime==="risk-off"?T.red:T.amber,fontSize:"11px",fontWeight:"700",padding:"2px 8px",borderRadius:"4px",textTransform:"uppercase"}}>{s.regime||"neutral"}</span>
            {s.confidence>0&&<span style={{fontSize:"11px",color:T.mute}}>Confidence: {s.confidence}%</span>}
          </div>
          <span style={{fontSize:"11px",color:T.mute}}>{s.runAt} ET</span>
        </div>
        {s.summary&&<div style={{fontSize:"13px",color:T.sub,lineHeight:"1.7",marginBottom:"12px",padding:"10px 12px",background:T.muted,borderRadius:"8px"}}>{s.summary}</div>}
        {s.keyThemes&&s.keyThemes.length>0&&<div style={{marginBottom:"12px"}}>
          <Lbl style={{marginBottom:"8px"}}>Key Themes</Lbl>
          <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
            {s.keyThemes.filter(t=>t.theme).map((t,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:"10px",padding:"8px 12px",background:T.muted,borderRadius:"6px"}}>
              <div style={{flex:1}}><span style={{fontSize:"13px",color:T.text,fontWeight:"500"}}>{t.theme}</span>{t.implication&&<span style={{fontSize:"12px",color:T.mute}}> — {t.implication}</span>}</div>
              {t.probability>0&&<span style={{fontSize:"12px",fontWeight:"700",color:t.probability>=60?T.green:t.probability>=40?T.amber:T.red}}>{t.probability}%</span>}

function PortfolioHealth({equities,openOpts,trades}){
  const[health,setHealth]=useStorage("alfie_portfolio_health",null);const[healthDate,setHealthDate]=useStorage("alfie_health_date","");const[loading,setLoading]=useState(false);
  const allTickers=[...new Set([...equities.map(e=>e.ticker),...openOpts.map(t=>t.ticker)])];
  async function runHealthCheck(){
    if(allTickers.length===0)return;setLoading(true);
    const eqByAccount={};equities.forEach(e=>{const acc=e.account||"Individual";if(!eqByAccount[acc])eqByAccount[acc]=[];eqByAccount[acc].push(`${e.ticker}${e.companyName?" ("+e.companyName+")":""} ${e.shares} shares @ $${e.costBasis}`);});
    const eqStr=Object.entries(eqByAccount).map(([acc,tickers])=>`${acc}: ${tickers.join(", ")}`).join(" | ");
    const optStr=openOpts.map(t=>`${t.ticker} ${t.contractType} $${t.strike} exp ${t.expiration}`).join(", ");
    const totalEqValue=equities.reduce((s,e)=>s+(parseFloat(e.currentPrice||e.costBasis||0)*parseFloat(e.shares||0)),0);
    const positions=`EQUITIES ($${totalEqValue.toLocaleString("en-US",{maximumFractionDigits:0})} total): ${eqStr||"None"} | OPTIONS: ${optStr||"None"}`;
    try{
      const sectorExp={};allTickers.forEach(t=>{const r=getRotationGrade(t);if(r){if(!sectorExp[r.sector])sectorExp[r.sector]=0;sectorExp[r.sector]++;}});
      const topSector=Object.entries(sectorExp).sort((a,b)=>b[1]-a[1])[0];
      const concentrationRisk=topSector&&topSector[1]/allTickers.length>0.4?`Overconcentrated in ${topSector[0]} (${Math.round(topSector[1]/allTickers.length*100)}% of positions)`:"Concentration acceptable";
      const sectorAlignments=allTickers.map(t=>{const r=getRotationGrade(t);return r?r.phase:"Unknown";});
      const leadingCount=sectorAlignments.filter(p=>p==="Leading"||p==="Early").length;
      const alignmentScore=Math.round(leadingCount/allTickers.length*100);
      const closedTrades=trades?trades.filter(t=>t.isOption&&t.status==="closed"):[];const tradeCount=closedTrades.length;
      const r=await callAPI([{role:"user",content:`You are a professional portfolio health analyst. Evaluate this portfolio.\n\nPositions: ${positions}\nSector concentration: ${concentrationRisk}\nRotation alignment: ${alignmentScore}% of positions in leading/early sectors\nClosed trades logged: ${tradeCount} (need 20+ for Sharpe/Sortino/Alpha metrics)\n\nGrade these factors (search web for insider activity):\n1. Sector Rotation Alignment (25%)\n2. Insider Activity (25%) - search SEC Form 4 data AND congressional STOCK Act disclosures on capitoltrades.com\n3. Concentration Risk (20%)\n\nNote Sharpe/Sortino/Alpha unlock after 20 closed trades (currently ${tradeCount}).\n\nAlso search web for current expert portfolio recommendations.\n\nReturn ONLY JSON: {"summary":"3-4 sentence CEO-level paragraph","urgentAlert":"one sentence or empty string","overallHealth":"strong|moderate|weak","factors":{"rotationAlignment":"one sentence","insiderActivity":"one sentence from web search","concentrationRisk":"one sentence","sharpeRatio":"Unlocks after 20 closed trades (${tradeCount} logged)","alpha":"Unlocks after 20 closed trades (${tradeCount} logged)"},"recommendations":[{"title":"","rationale":"","action":"","source":""},{"title":"","rationale":"","action":"","source":""},{"title":"","rationale":"","action":"","source":""},{"title":"","rationale":"","action":"","source":""}]}`}],true);
      setHealth(r);setHealthDate(getTodayKey());
    }catch(err){console.error(err);}
    setLoading(false);
  }
  useEffect(()=>{if(allTickers.length===0)return;const today=getTodayKey();if(healthDate!==today||!health)runHealthCheck();},[]);
  if(allTickers.length===0)return null;
  const healthColor=h=>h==="strong"?T.green:h==="weak"?T.red:T.amber;
  return(<Card style={{marginBottom:"16px"}}><div style={{padding:"13px 18px",borderBottom:"1px solid "+T.border,display:"flex",alignItems:"center",justifyContent:"space-between"}}><div style={{display:"flex",alignItems:"center",gap:"8px"}}><span style={{fontSize:"15px",fontWeight:"600",color:T.text}}>Portfolio Health</span>{health&&health.overallHealth&&<span style={{background:healthColor(health.overallHealth)+"22",color:healthColor(health.overallHealth),fontSize:"11px",fontWeight:"700",padding:"2px 10px",borderRadius:"4px",textTransform:"uppercase"}}>{health.overallHealth}</span>}</div><button onClick={runHealthCheck} disabled={loading} style={{background:"transparent",border:"1px solid "+T.border,color:T.mute,fontSize:"11px",padding:"3px 12px",borderRadius:"5px",cursor:"pointer",fontFamily:T.font,opacity:loading?0.5:1}}>{loading?"Analyzing…":"↻ Refresh"}</button></div><div style={{padding:"14px 18px"}}>{loading&&<div style={{display:"flex",alignItems:"center",gap:"8px",fontSize:"13px",color:T.mute}}><div style={{width:"7px",height:"7px",background:T.blue,borderRadius:"50%",animation:"alfpulse 1s infinite"}}/>Scanning all positions for insider flow, risks and opportunities…</div>}{!loading&&health&&<div>{health.urgentAlert&&<div style={{background:T.redPale,border:"1px solid "+T.red,borderRadius:"7px",padding:"10px 14px",marginBottom:"10px",fontSize:"13px",color:T.red,fontWeight:"600"}}>⚡ {health.urgentAlert}</div>}<div style={{fontSize:"13px",color:T.sub,lineHeight:"1.8",marginBottom:"12px"}}>{health.summary}</div>{health.factors&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px",marginBottom:"10px"}}>{[["Rotation Alignment",health.factors.rotationAlignment,false],["Insider Activity",health.factors.insiderActivity,false],["Concentration Risk",health.factors.concentrationRisk,false],["Sharpe / Sortino",health.factors.sharpeRatio,true],["Alpha vs Benchmark",health.factors.alpha,true]].map(([l,v,pending])=>v?<div key={l} style={{background:T.muted,borderRadius:"6px",padding:"8px 10px",opacity:pending?0.6:1,border:pending?"1px dashed "+T.border:"1px solid transparent"}}><div style={{display:"flex",alignItems:"center",gap:"6px",marginBottom:"3px"}}><div style={{fontSize:"10px",color:T.mute,fontWeight:"600"}}>{l.toUpperCase()}</div>{pending&&<span style={{fontSize:"9px",color:T.amber,fontWeight:"600"}}>PENDING</span>}</div><div style={{fontSize:"12px",color:pending?T.mute:T.sub,lineHeight:"1.4"}}>{v}</div></div>:null)}</div>}{health.recommendations&&health.recommendations.length>0&&<div style={{marginTop:"12px"}}><div style={{fontSize:"11px",color:T.mute,fontWeight:"600",letterSpacing:"0.06em",marginBottom:"8px"}}>EXPERT RECOMMENDATIONS</div><div style={{display:"flex",flexDirection:"column",gap:"8px"}}>{health.recommendations.filter(r=>r.title).map((rec,i)=>(<div key={i} style={{background:T.muted,borderRadius:"8px",padding:"12px 14px",borderLeft:"3px solid "+T.blue}}><div style={{fontSize:"13px",fontWeight:"600",color:T.text,marginBottom:"4px"}}>{rec.title}</div><div style={{fontSize:"12px",color:T.sub,lineHeight:"1.5",marginBottom:"6px"}}>{rec.rationale}</div><div style={{fontSize:"12px",color:T.blue,marginBottom:"4px"}}>{"→"} {rec.action}</div>{rec.source&&<div style={{fontSize:"10px",color:T.mute,fontWeight:"600"}}>SOURCE: {rec.source}</div>}</div>))}</div></div>}{healthDate&&<div style={{fontSize:"11px",color:T.mute,marginTop:"10px"}}>Last updated: {healthDate===getTodayKey()?"Today":healthDate}</div>}</div>}{!loading&&!health&&<div style={{fontSize:"13px",color:T.mute,textAlign:"center",padding:"10px 0"}}>Tap Refresh to run your first portfolio health check.</div>}</div></Card>);
}

function MorningBrief({trades,equities,setSectorUpdates,setConvList}){
  const[brief,setBrief]=useStorage("alfie_brief",null);const[lastDate,setLastDate]=useStorage("alfie_brief_date","");const[loading,setLoading]=useState(false);const[speaking,setSpeaking]=useState(false);const[step,setStep]=useState("");
  const openOpts=trades.filter(t=>t.isOption&&t.status==="open");
  useEffect(()=>{const today=getTodayKey();if(lastDate!==today){generateBrief();}},[]);
  async function generateBrief(){
    setLoading(true);setBrief(null);
    const today=new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
    const openPositions=openOpts.map(t=>`${t.ticker} ${t.contractType} $${t.strike} exp ${t.expiration} (${Math.ceil((new Date(t.expiration)-new Date())/86400000)}d DTE)`).join(", ")||"None";
    const eqPositions=(equities||[]).map(e=>`${e.ticker}${e.companyName?" ("+e.companyName+")":""} ${e.shares} shares @ $${e.costBasis} [${e.account||"Individual"}]`).join(", ")||"None";
    const totalEqValue=(equities||[]).reduce((s,e)=>s+(parseFloat(e.currentPrice||e.costBasis||0)*parseFloat(e.shares||0)),0);
    try{
      setStep("Fetching weather, news & market data...");
      const [wxSectRes,newsMktRes]=await Promise.all([
        callAPI([{role:"user",content:`Search for: (1) current weather in Fairfield Connecticut right now, AND (2) today's ${today} sector rotation — which sectors are leading and lagging. Return ONLY JSON: {"temp":"","condition":"","high":"","low":"","wind":"","humidity":"","leading":[{"sector":"","reason":""},{"sector":"","reason":""}],"lagging":[{"sector":"","reason":""},{"sector":"","reason":""}],"rotationTheme":"one sentence on overall rotation theme today","sectorPhases":[{"name":"Semiconductors","phase":"Leading","score":95}]}`}],true),
        callAPI([{role:"user",content:`Search for: (1) top 3 major world news stories today ${today} affecting financial markets, AND (2) current pre-market futures and market data today. Return ONLY JSON: {"stories":[{"headline":"","summary":"one sentence","marketImpact":"bullish|bearish|neutral","sectors":[""]},{"headline":"","summary":"","marketImpact":"neutral","sectors":[""]},{"headline":"","summary":"","marketImpact":"neutral","sectors":[""]}],"spFutures":"","nasdaqFutures":"","dowFutures":"","vix":"","preMarketMovers":[{"ticker":"","change":"","reason":""},{"ticker":"","change":"","reason":""}],"marketSentiment":"bullish|bearish|neutral","sentimentReason":""}`}],true)
      ]);
      const weatherRes={temp:wxSectRes.temp,condition:wxSectRes.condition,high:wxSectRes.high,low:wxSectRes.low,wind:wxSectRes.wind,humidity:wxSectRes.humidity};
      const sectorRes={leading:wxSectRes.leading||[],lagging:wxSectRes.lagging||[],rotationTheme:wxSectRes.rotationTheme,sectorPhases:wxSectRes.sectorPhases||[]};
      if(sectorRes.sectorPhases.length>0){const updates={};sectorRes.sectorPhases.forEach(s=>{updates[s.name]={phase:s.phase,score:s.score,updatedAt:new Date().toISOString()};});setSectorUpdates(updates);}
      const newsRes={stories:newsMktRes.stories||[]};
      const marketRes={spFutures:newsMktRes.spFutures,nasdaqFutures:newsMktRes.nasdaqFutures,dowFutures:newsMktRes.dowFutures,vix:newsMktRes.vix,preMarketMovers:newsMktRes.preMarketMovers,marketSentiment:newsMktRes.marketSentiment,sentimentReason:newsMktRes.sentimentReason};
      setStep("Analyzing your positions...");
      let positionAlert=null;
      if(openOpts.length>0||(equities&&equities.length>0)){
        const posRes=await callAPI([{role:"user",content:`I have these positions today (${today}):\nOPTIONS: ${openPositions}\nEQUITIES ($${totalEqValue.toLocaleString("en-US",{maximumFractionDigits:0})} total): ${eqPositions}\n\nSearch for any urgent news or alerts on these tickers. Return ONLY JSON: {"alerts":[{"ticker":"","alert":"","urgency":"high|medium|low"}],"summary":"one sentence overall assessment of all my positions today"}`}],true);
        positionAlert=posRes;
      }
      const result={date:today,weather:weatherRes,news:newsRes,market:marketRes,sectors:sectorRes,positions:positionAlert,generatedAt:new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"})};
      setBrief(result);setLastDate(getTodayKey());
      // Update conviction list non-blocking (doesn't block brief display)
      callAPI([{role:"user",content:"Search web for top momentum stocks in leading sectors right now. Return ONLY JSON: {\"tickers\":[\"VRT\",\"ETN\"]}. Include 20 tickers max from leading sectors only."}],true).then(d=>{if(d&&Array.isArray(d.tickers)&&d.tickers.length>0)setConvList(d.tickers);}).catch(()=>{});
    }catch(err){console.error("Brief error:",err);}
    setLoading(false);setStep("");
  }
  function speak(){
    if(!brief)return;if(speaking){window.speechSynthesis.cancel();setSpeaking(false);return;}
    const parts=["Good morning, Raleigh. Here is your Alfie morning brief for "+brief.date+"."];
    if(brief.weather)parts.push("Weather in Fairfield: "+brief.weather.temp+" degrees, "+brief.weather.condition+". High of "+brief.weather.high+", low of "+brief.weather.low+".");
    if(brief.market)parts.push("Markets: S&P futures "+brief.market.spFutures+". Nasdaq "+brief.market.nasdaqFutures+". VIX at "+brief.market.vix+". "+brief.market.sentimentReason+".");
    if(brief.news&&brief.news.stories)brief.news.stories.forEach((s,i)=>{parts.push("News story "+(i+1)+": "+s.headline+". "+s.summary);});
    if(brief.sectors)parts.push("Sector rotation today: "+brief.sectors.rotationTheme);
    if(brief.positions&&brief.positions.summary)parts.push("Your positions: "+brief.positions.summary);
    parts.push("That concludes your morning brief. Have a great trading day.");
    const utterance=new SpeechSynthesisUtterance(parts.join(" "));utterance.rate=0.92;utterance.pitch=1.05;
    const voices=window.speechSynthesis.getVoices();const preferred=["Samantha","Karen","Moira","Fiona","Victoria","Allison","Ava","Susan","Zira","Helena","Google UK English Female","Microsoft Zira","Microsoft Aria"];
    let selectedVoice=null;for(const name of preferred){const v=voices.find(v=>v.name.includes(name));if(v){selectedVoice=v;break;}}
    if(!selectedVoice)selectedVoice=voices.find(v=>v.name.toLowerCase().includes("female")||v.name.toLowerCase().includes("woman"));
    if(selectedVoice)utterance.voice=selectedVoice;utterance.onend=()=>setSpeaking(false);window.speechSynthesis.speak(utterance);setSpeaking(true);
  }
  const impactColor=i=>i==="bullish"?T.green:i==="bearish"?T.red:T.amber;const impactBg=i=>i==="bullish"?T.greenPale:i==="bearish"?T.redPale:T.amberPale;
  return(<div>
    <div style={{background:T.navy,borderRadius:"12px",padding:"20px",marginBottom:"16px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:"10px"}}>
        <div><div style={{fontSize:"22px",fontWeight:"700",color:"#fff",marginBottom:"4px"}}>Good Morning, Raleigh</div><div style={{fontSize:"13px",color:T.navyLight}}>{brief?brief.date:new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</div>{brief&&<div style={{fontSize:"11px",color:T.navyLight,marginTop:"2px"}}>Generated at {brief.generatedAt}</div>}</div>
        <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>{brief&&<button onClick={speak} style={{background:speaking?"rgba(220,38,38,0.3)":"rgba(22,163,74,0.3)",border:"1px solid "+(speaking?"rgba(220,38,38,0.5)":"rgba(22,163,74,0.5)"),color:speaking?"#fca5a5":"#86efac",fontSize:"12px",fontWeight:"700",padding:"6px 16px",borderRadius:"6px",cursor:"pointer",fontFamily:T.font}}>{speaking?"Stop Reading":"Read Brief"}</button>}<button onClick={generateBrief} disabled={loading} style={{background:"rgba(37,99,235,0.3)",border:"1px solid rgba(37,99,235,0.5)",color:"#93c5fd",fontSize:"12px",fontWeight:"700",padding:"6px 16px",borderRadius:"6px",cursor:loading?"not-allowed":"pointer",fontFamily:T.font,opacity:loading?0.6:1}}>{loading?"Generating...":"Refresh"}</button></div>
      </div>
      {loading&&<div style={{marginTop:"12px",display:"flex",alignItems:"center",gap:"8px",fontSize:"12px",color:T.navyLight}}><div style={{width:"8px",height:"8px",background:T.navyLight,borderRadius:"50%",animation:"alfpulse 1s infinite"}}/>{step}</div>}
    </div>
    {!brief&&!loading&&<div style={{textAlign:"center",padding:"60px 20px",color:T.mute,fontSize:"14px"}}>Generating your morning brief...</div>}
    {brief&&<div style={{display:"grid",gap:"12px"}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px"}}>
        {brief.weather&&<Card style={{padding:"16px"}}><div style={{fontSize:"11px",color:T.mute,fontWeight:"600",letterSpacing:"0.06em",marginBottom:"10px"}}>WEATHER — FAIRFIELD, CT</div><div style={{display:"flex",alignItems:"center",gap:"12px",marginBottom:"8px"}}><div style={{fontSize:"36px",fontWeight:"300",color:T.blue}}>{brief.weather.temp}°</div><div><div style={{fontSize:"14px",fontWeight:"600",color:T.text}}>{brief.weather.condition}</div><div style={{fontSize:"12px",color:T.mute}}>H: {brief.weather.high}° L: {brief.weather.low}°</div></div></div><div style={{fontSize:"12px",color:T.mute}}>Wind: {brief.weather.wind} · Humidity: {brief.weather.humidity}</div></Card>}
        {brief.market&&<Card style={{padding:"16px"}}><div style={{fontSize:"11px",color:T.mute,fontWeight:"600",letterSpacing:"0.06em",marginBottom:"10px"}}>MARKET PULSE</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"6px",marginBottom:"8px"}}>{[["S&P",brief.market.spFutures],["Nasdaq",brief.market.nasdaqFutures],["VIX",brief.market.vix]].map(([l,v])=>(<div key={l} style={{background:T.muted,borderRadius:"6px",padding:"6px 8px",textAlign:"center"}}><div style={{fontSize:"9px",color:T.mute,fontWeight:"600",marginBottom:"2px"}}>{l}</div><div style={{fontSize:"13px",fontWeight:"700",color:v&&v.includes("-")?T.red:T.green}}>{v||"—"}</div></div>))}</div><div style={{display:"flex",alignItems:"center",gap:"6px"}}><div style={{width:"8px",height:"8px",borderRadius:"50%",background:brief.market.marketSentiment==="bullish"?T.green:brief.market.marketSentiment==="bearish"?T.red:T.amber,flexShrink:0}}/><div style={{fontSize:"11px",color:T.sub,lineHeight:"1.4"}}>{brief.market.sentimentReason}</div></div></Card>}
      </div>
      {brief.news&&brief.news.stories&&<Card style={{padding:"16px"}}><div style={{fontSize:"11px",color:T.mute,fontWeight:"600",letterSpacing:"0.06em",marginBottom:"12px"}}>WORLD NEWS — MARKET IMPACT</div><div style={{display:"flex",flexDirection:"column",gap:"10px"}}>{brief.news.stories.map((s,i)=>(<div key={i} style={{display:"flex",gap:"12px",alignItems:"flex-start",paddingBottom:"10px",borderBottom:i<2?"1px solid "+T.border:"none"}}><div style={{background:impactBg(s.marketImpact),color:impactColor(s.marketImpact),fontSize:"10px",fontWeight:"700",padding:"3px 8px",borderRadius:"4px",whiteSpace:"nowrap",flexShrink:0}}>{(s.marketImpact||"neutral").toUpperCase()}</div><div style={{flex:1}}><div style={{fontSize:"13px",fontWeight:"600",color:T.text,marginBottom:"3px"}}>{s.headline}</div><div style={{fontSize:"12px",color:T.sub,lineHeight:"1.5"}}>{s.summary}</div>{s.sectors&&s.sectors.length>0&&<div style={{display:"flex",gap:"4px",marginTop:"5px",flexWrap:"wrap"}}>{s.sectors.filter(x=>x).map(sec=><span key={sec} style={{background:T.bluePale,color:T.blue,fontSize:"10px",fontWeight:"600",padding:"1px 6px",borderRadius:"4px"}}>{sec}</span>)}</div>}</div></div>))}</div></Card>}
      {brief.sectors&&<Card style={{padding:"16px"}}><div style={{fontSize:"11px",color:T.mute,fontWeight:"600",letterSpacing:"0.06em",marginBottom:"8px"}}>SECTOR ROTATION TODAY</div><div style={{fontSize:"13px",color:T.sub,fontStyle:"italic",marginBottom:"12px"}}>{brief.sectors.rotationTheme}</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"}}><div><div style={{fontSize:"10px",color:T.green,fontWeight:"700",marginBottom:"6px"}}>LEADING</div>{(brief.sectors.leading||[]).map((s,i)=>(<div key={i} style={{marginBottom:"6px"}}><div style={{fontSize:"13px",fontWeight:"600",color:T.text}}>{s.sector}</div><div style={{fontSize:"11px",color:T.mute}}>{s.reason}</div></div>))}</div><div><div style={{fontSize:"10px",color:T.red,fontWeight:"700",marginBottom:"6px"}}>LAGGING</div>{(brief.sectors.lagging||[]).map((s,i)=>(<div key={i} style={{marginBottom:"6px"}}><div style={{fontSize:"13px",fontWeight:"600",color:T.text}}>{s.sector}</div><div style={{fontSize:"11px",color:T.mute}}>{s.reason}</div></div>))}</div></div></Card>}
      {brief.positions&&<Card style={{padding:"16px"}}><div style={{fontSize:"11px",color:T.mute,fontWeight:"600",letterSpacing:"0.06em",marginBottom:"8px"}}>YOUR POSITIONS TODAY</div><div style={{fontSize:"13px",color:T.sub,marginBottom:"10px"}}>{brief.positions.summary}</div>{(brief.positions.alerts||[]).filter(a=>a.ticker).map((a,i)=>(<div key={i} style={{display:"flex",gap:"10px",alignItems:"flex-start",padding:"8px 10px",background:a.urgency==="high"?T.redPale:a.urgency==="medium"?T.amberPale:T.muted,borderRadius:"6px",marginBottom:"6px"}}><span style={{fontWeight:"700",color:T.text,fontSize:"13px"}}>{a.ticker}</span><span style={{fontSize:"12px",color:T.sub,flex:1}}>{a.alert}</span><span style={{fontSize:"10px",fontWeight:"700",color:a.urgency==="high"?T.red:a.urgency==="medium"?T.amber:T.mute,textTransform:"uppercase"}}>{a.urgency}</span></div>))}</Card>}
      {brief.market&&brief.market.preMarketMovers&&brief.market.preMarketMovers.length>0&&<Card style={{padding:"16px"}}><div style={{fontSize:"11px",color:T.mute,fontWeight:"600",letterSpacing:"0.06em",marginBottom:"10px"}}>PRE-MARKET MOVERS</div><div style={{display:"flex",flexDirection:"column",gap:"8px"}}>{brief.market.preMarketMovers.filter(m=>m.ticker).map((m,i)=>(<div key={i} style={{display:"flex",gap:"12px",alignItems:"center"}}><span style={{fontWeight:"700",fontSize:"14px",color:T.text,minWidth:"60px"}}>{m.ticker}</span><span style={{fontWeight:"700",fontSize:"13px",color:m.change&&m.change.includes("-")?T.red:T.green,minWidth:"60px"}}>{m.change}</span><span style={{fontSize:"12px",color:T.sub,flex:1}}>{m.reason}</span></div>))}</div></Card>}
      <Card style={{padding:"16px",border:"2px dashed "+T.border}}><div style={{fontSize:"11px",color:T.mute,fontWeight:"600",letterSpacing:"0.06em",marginBottom:"8px"}}>AGENT REPORT</div><div style={{display:"flex",alignItems:"center",gap:"10px",padding:"14px",background:T.muted,borderRadius:"8px"}}><div style={{fontSize:"24px"}}>🤖</div><div><div style={{fontSize:"13px",fontWeight:"600",color:T.sub,marginBottom:"3px"}}>Agents Coming Soon</div><div style={{fontSize:"12px",color:T.mute}}>When your Mac Mini arrives, agents will monitor your positions overnight, find new option contracts that match your trading style, run quantitative analysis, and report here every morning automatically.</div></div></div></Card>
    </div>}
  </div>);
}

function Nav({active,setActive}){const tabs=[{id:"brief",label:"Morning Brief"},{id:"agents",label:"🤖 Agent Report"},{id:"checklist",label:"Checklist"},{id:"portfolio",label:"Portfolio"},{id:"trades",label:"Trade Journal"},{id:"research",label:"Trade Research"},{id:"social",label:"Social Feed"},{id:"journal",label:"Daily Journal"}];return(<nav style={{display:"flex",gap:"2px",borderBottom:"1px solid "+T.border,background:"#010409",padding:"0 16px",overflowX:"auto",WebkitOverflowScrolling:"touch"}}>{tabs.map(t=><button key={t.id} onClick={()=>setActive(t.id)} style={{background:"none",border:"none",borderBottom:active===t.id?"2px solid "+T.blue:"2px solid transparent",cursor:"pointer",padding:"12px 14px",fontSize:"13px",fontFamily:T.font,color:active===t.id?T.blue:T.mute,marginBottom:"-1px",transition:"color 0.15s",fontWeight:active===t.id?"600":"400",whiteSpace:"nowrap"}}>{t.label}</button>)}</nav>);}

function App(){
  const[tab,setTab]=useState("brief");
  const[equities,setEquities]=useStorage("alfie_equities",[]);
  const[sectorUpdates,setSectorUpdates]=useStorage("alfie_sector_updates",{});
  const[convList,setConvList]=useStorage("alfie_conv",TOP_CONVICTION);
  const[trades,setTrades]=useStorage("alfie_trades",[]);
  const[journal,setJournal]=useStorage("alfie_journal",{});
  const[rTicker,setRTicker]=useState("");const[rNotes,setRNotes]=useState("");const[rSentiment,setRSentiment]=useState("");const[rData,setRData]=useState(null);const[rLoading,setRLoading]=useState(false);const[rError,setRError]=useState(null);
  const[time,setTime]=useState(new Date());
  useEffect(()=>{const id=setInterval(()=>setTime(new Date()),1000);return()=>clearInterval(id);},[]);
  const dateStr=new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
  return(<div style={{minHeight:"100vh",background:T.bg,color:T.text,fontFamily:T.font}}>
    <div style={{background:"#010409",borderBottom:"1px solid "+T.border,padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div style={{display:"flex",alignItems:"center",gap:"6px"}}><SyncBadge/><TokenMonitor/></div>
      <div style={{textAlign:"center"}}><div style={{fontSize:"22px",fontWeight:"700",color:"#fff"}}>Alfie</div><div style={{fontSize:"11px",color:T.navyLight,marginTop:"2px",letterSpacing:"0.04em"}}>Personal command center</div></div>
      <div style={{display:"flex",alignItems:"center",gap:"10px"}}><DataControls trades={trades} equities={equities} journal={journal}/><div style={{textAlign:"right"}}><div style={{fontSize:"10px",color:T.navyLight}}>{dateStr}</div><div style={{fontSize:"16px",fontWeight:"300",color:"#fff",marginTop:"2px"}}>{time.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}</div></div></div>
    </div>
    {rLoading&&<div style={{background:T.bluePale,borderBottom:"1px solid "+T.border,padding:"8px 16px",display:"flex",alignItems:"center",gap:"10px"}}><div style={{width:"8px",height:"8px",background:T.blue,borderRadius:"50%",animation:"alfpulse 1s infinite",flexShrink:0}}/><span style={{fontSize:"13px",color:T.blue,fontWeight:"500"}}>Researching {rTicker}…</span><span style={{marginLeft:"auto",fontSize:"12px",color:T.blue,cursor:"pointer",textDecoration:"underline"}} onClick={()=>setTab("research")}>View →</span></div>}
    <Nav active={tab} setActive={setTab}/>
    <div style={{maxWidth:"1400px",margin:"0 auto",padding:"16px"}}>
      {tab==="brief"&&<MorningBrief trades={trades} equities={equities} setSectorUpdates={setSectorUpdates} setConvList={setConvList}/>
      }{tab==="agents"&&<AgentReport/>}
      {tab==="portfolio"&&<PortfolioOverview trades={trades} equities={equities} setEquities={setEquities}/>}
      {tab==="checklist"&&<DailyChecklist/>}
      {tab==="trades"&&<TradeJournal trades={trades} setTrades={setTrades}/>}
      {tab==="research"&&<TradeResearch sectorUpdates={sectorUpdates} convList={convList} ticker={rTicker} setTicker={setRTicker} notes={rNotes} setNotes={setRNotes} sentiment={rSentiment} setSentiment={setRSentiment} research={rData} setResearch={setRData} loading={rLoading} setLoading={setRLoading} error={rError} setError={setRError}/>}
      {tab==="social"&&<SocialFeed/>}
      {tab==="journal"&&<DailyJournal entries={journal} setEntries={setJournal}/>}
    </div>
  </div>);
}
const ALFIE_PASSWORD="champ2025";
function Login({onAuth}){
  const[pw,setPw]=useState("");const[err,setErr]=useState(false);const[shake,setShake]=useState(false);
  function attempt(){
    if(pw===ALFIE_PASSWORD){localStorage.setItem("alfie_auth","1");onAuth();}
    else{setErr(true);setShake(true);setPw("");setTimeout(()=>setShake(false),500);}
  }
  return(<div style={{minHeight:"100vh",background:"#0d1117",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:T.font}}>
    <div style={{background:T.card,border:"1px solid "+T.border,borderRadius:"16px",padding:"40px 36px",width:"100%",maxWidth:"360px",textAlign:"center",animation:shake?"shake 0.4s ease":"none"}}>
      <style>{`@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}`}</style>
      <div style={{fontSize:"32px",marginBottom:"8px"}}>🤖</div>
      <div style={{fontSize:"22px",fontWeight:"700",color:"#fff",marginBottom:"4px"}}>Alfie</div>
      <div style={{fontSize:"12px",color:T.mute,marginBottom:"28px",letterSpacing:"0.04em"}}>PERSONAL COMMAND CENTER</div>
      <input
        type="password"
        value={pw}
        onChange={e=>{setPw(e.target.value);setErr(false);}}
        onKeyDown={e=>e.key==="Enter"&&attempt()}
        placeholder="Password"
        autoFocus
        style={{background:T.muted,border:"1px solid "+(err?T.red:T.border),color:T.text,padding:"10px 14px",fontSize:"15px",fontFamily:T.font,outline:"none",width:"100%",boxSizing:"border-box",borderRadius:"8px",marginBottom:"10px",textAlign:"center",letterSpacing:"0.15em"}}
      />
      {err&&<div style={{fontSize:"12px",color:T.red,marginBottom:"10px"}}>Incorrect password</div>}
      <button onClick={attempt} style={{background:T.blue,color:"#fff",border:"none",padding:"10px",fontSize:"14px",fontWeight:"600",cursor:"pointer",fontFamily:T.font,borderRadius:"8px",width:"100%"}}>Enter</button>
    </div>
  </div>);
}
function Root(){
  const[authed,setAuthed]=useState(()=>localStorage.getItem("alfie_auth")==="1");
  if(!authed)return <Login onAuth={()=>setAuthed(true)}/>;
  return <App/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
